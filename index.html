<!doctype html>
<html lang="en" class="">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!-- Primary SEO -->
    <title>Ghanshyam Singh — Backend Developer</title>
    <meta
      name="description"
      content="Portfolio of Ghanshyam Singh, a Backend Engineer building production-ready AI systems with multi-agent orchestration, RAG, computer vision, and scalable backend architecture."
    />
    <meta name="author" content="Ghanshyam Singh" />

    <!-- Open Graph -->
    <meta property="og:title" content="Ghanshyam Singh — Backend Developer" />
    <meta
      property="og:description"
      content="Portfolio of Ghanshyam Singh, a Backend Engineer building production-ready AI systems with multi-agent orchestration, RAG, computer vision, and scalable backend architecture."
    />
    <meta property="og:type" content="profile" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Ghanshyam Singh — Backend Developer" />

    <!-- Favicon -->
    <link rel="icon" href="/favicon.ico" type="image/x-icon" />

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Instrument+Sans:ital,wght@0,400..700;1,400..700&family=JetBrains+Mono:wght@400;500&display=swap"
    />

    <!-- Dark mode flash prevention — runs before first paint -->
    <script>
      try {
        var t = localStorage.getItem("gs-theme");
        if (!t) {
          t = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        }
        if (t === "dark") {
          document.documentElement.classList.add("dark");
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
